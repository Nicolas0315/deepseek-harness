name: Free Intel macOS qualification
on:
  push:
    branches: [codex/qa-intel-20261015]
permissions:
  contents: read
concurrency:
  group: free-intel-qualification
  cancel-in-progress: false
jobs:
  mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_DESKTOP_BUILD_VERSION: '0.2.1-alpha.3'
      DSH_GATE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 873be5eb5a16c4188b67977fa969bce28e666f39
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Confirm standard Intel environment
        run: |
          test "$(git rev-parse HEAD)" = 873be5eb5a16c4188b67977fa969bce28e666f39
          test "$(uname -m)" = x86_64
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,version:process.version})'
          df -h .
          npm install --global pnpm@11.28.5
      - name: Install locked source dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned package and run official native runtime qualification
        shell: bash
        run: |
          pnpm run package:desktop:mac:x64:unsigned 2>&1 | sed -E 's/(token=)[^&[:space:]]+/\1[redacted]/g'
      - name: Verify disk image
        run: |
          hdiutil verify apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/deepseek-harness-0.2.1-alpha.3-mac-x64-unsigned.dmg
          shasum -a 256 apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/deepseek-harness-0.2.1-alpha.3-mac-x64-unsigned.dmg
      - name: Convert Japanese Office documents with the packaged Intel runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, tempfile
          from pathlib import Path
          work = Path(tempfile.mkdtemp(prefix="dsh-ja-office-", dir=os.environ["RUNNER_TEMP"]))
          scripts = {'dsh-japanese-office-inputs-20261015.py': '', 'dsh-japanese-office-probe-20261015.mjs': ''}
          for name, encoded in scripts.items():
              (work / name).write_bytes(base64.b64decode(encoded, validate=True))
          resources = Path(os.environ["GITHUB_WORKSPACE"]) / "apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/mac/DeepSeek Harness.app/Contents/Resources"
          output = work / "conversion"
          subprocess.run(["node", str(work / "dsh-japanese-office-probe-20261015.mjs"), "--resources", str(resources), "--output", str(output), "--generator", str(work / "dsh-japanese-office-inputs-20261015.py")], check=True)
          documents = output / "日本語 空白"
          expected = json.loads((documents / "expected.json").read_text(encoding="utf-8"))
          print("JAPANESE_OFFICE_EXPECTED " + json.dumps(expected, ensure_ascii=False))
          for entry in expected["files"]:
              data = (documents / entry["pdf"]).read_bytes()
              encoded = base64.b64encode(data).decode()
              chunks = [encoded[i:i+4096] for i in range(0, len(encoded), 4096)]
              for index, chunk in enumerate(chunks):
                  print("JAPANESE_OFFICE_PDF_CHUNK " + json.dumps({"format":entry["format"], "file":entry["pdf"], "sha256":hashlib.sha256(data).hexdigest(), "index":index, "total":len(chunks), "base64":chunk}))
          PY
      - name: Verify all declared dependency files remain locked
        run: git diff --exit-code -- pnpm-lock.yaml package.json pnpm-workspace.yaml ':(glob)**/package.json'
